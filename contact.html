<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NØIR | Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400&family=Outfit:wght@200;300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/layout.css">
  <style>
    .page-content {
      padding-top: 150px;
      padding-bottom: var(--spacing-32);
      min-height: 80vh;
    }
  </style>
</head>
<body>
  
  <main class="page-content container">
    <h1 class="display-title" style="margin-bottom: var(--spacing-8);">CONTACT</h1>
    <div class="body-text" style="color: var(--color-text-secondary); max-width: 600px; line-height: 1.6;">
      <p style="margin-bottom: var(--spacing-6);">For press, wholesale, and general inquiries, please contact our studio.</p>
      <p class="tech-text" style="color: var(--color-primary);">STUDIO@NOIR-ARCHIVE.COM</p>
      <br>
      <p style="margin-bottom: var(--spacing-6);">For order support, please include your order number in the subject line.</p>
      <p class="tech-text" style="color: var(--color-primary);">SUPPORT@NOIR-ARCHIVE.COM</p>
    </div>
  </main>

  <script type="module">
    import { loadHeader, loadFooter } from './js/components.js';
    import { cart } from './js/cart.js';
    
    document.addEventListener('DOMContentLoaded', () => {
      loadHeader();
      loadFooter();
    });
  </script>
</body>
</html>
